<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Reset your Shift Dynamics account password">

    <title>Forgot Password | Shift Dynamics</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Dots&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/forgot-password.css">
    <link rel="stylesheet" href="assets/css/mechanical-grid.css">
</head>

<body>

    <!-- Header -->
    <header class="sd-auth-header">
        <nav class="sd-auth-nav">

            <a
                href="index.html"
                class="sd-auth-brand"
                aria-label="Shift Dynamics Home">

                <img
                    src="assets/images/shift-dynamics-logo.png.png"
                    alt="Shift Dynamics"
                    class="sd-auth-logo">

                <span class="sd-auth-brand-name">
                    SHIFT <span>DYNAMICS</span>
                </span>
            </a>

            <a href="login.html" class="sd-back-login">
                <i class="bi bi-arrow-left"></i>
                Back to Login
            </a>

        </nav>
    </header>

    <!-- Password Recovery -->
    <main class="sd-forgot-main sd-mechanical-grid">

        <div
            class="sd-decoration sd-decoration-one"
            aria-hidden="true"></div>

        <div
            class="sd-decoration sd-decoration-two"
            aria-hidden="true"></div>

        <section class="sd-forgot-card">

            <div class="sd-forgot-icon">
                <i class="bi bi-key-fill"></i>
            </div>

            <div class="sd-forgot-heading">
                <span class="sd-auth-badge">
                    Account Recovery
                </span>

                <h1>Forgot your password?</h1>

                <p>
                    Enter the email address associated with your
                    Shift Dynamics account.
                </p>
            </div>

            <form
                id="forgotPasswordForm"
                class="sd-forgot-form"
                novalidate>

                <div class="sd-form-group">
                    <label for="email">Email Address</label>

                    <div
                        class="sd-input-wrapper"
                        id="emailWrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required>
                    </div>

                    <small
                        id="emailError"
                        class="sd-field-error"></small>
                </div>

                <div
                    id="forgotMessage"
                    class="sd-form-message"
                    role="alert"
                    aria-live="polite"></div>

                <button
                    type="submit"
                    id="resetButton"
                    class="sd-reset-button">

                    <span>Send Reset Instructions</span>
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <div class="sd-security-note">
                <i class="bi bi-shield-lock-fill"></i>

                <p>
                    For security, this page will not reveal whether
                    an email address is registered.
                </p>
            </div>

            <div class="sd-login-link">
                <span>Remember your password?</span>

                <a href="login.html">
                    Sign In
                </a>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="sd-auth-footer">
        <p>
            &copy; <span id="currentYear">2026</span>
            Shift Dynamics. All rights reserved.
        </p>
    </footer>

    <script src="assets/js/forgot-password.js"></script>

</body>

</html>
