<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password | Shift Dynamics</title>
  <link rel="stylesheet" href="assets/css/forgot-password.css">
  <style>body{font-family:Arial,sans-serif;background:#f4f6fb;color:#172554}main{max-width:460px;margin:8vh auto;padding:32px;background:white;border-radius:16px;box-shadow:0 8px 32px #17255418}label{display:block;margin:18px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:24px;padding:12px 20px;background:#1e40af;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}#resetMessage{margin:16px 0;line-height:1.5}</style>
<link rel="icon" type="image/png" href="assets/images/shift-dynamics-logo.png.png">
<link rel="stylesheet" href="assets/css/wireframe-public.css?v=20261008-110535-504">
<link rel="stylesheet" href="assets/css/layout-brand-theme.css?v=20261008-110544-697">
</head>
<body>
<main>
  <h1>Reset your password</h1>
  <p>Choose a new password with at least eight characters.</p>
  <form id="resetPasswordForm">
    <label for="resetEmail">Email</label><input id="resetEmail" type="email" autocomplete="email" required maxlength="191">
    <label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="100">
    <label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="100">
    <button type="submit">Reset password</button>
  </form>
  <p id="resetMessage" role="status" aria-live="polite"></p>
  <p><a href="login.html">Customer login</a> · <a href="staff-login.html">Staff login</a></p>
</main>
<script src="assets/js/api-client.js"></script>
<script src="assets/js/reset-password.js"></script>
</body>
</html>
